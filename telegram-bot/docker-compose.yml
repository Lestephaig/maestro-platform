services:
  telegram-bot:
    build: .
    restart: unless-stopped
    init: true
    volumes:
      - ./.env:/app/.env:ro
      - telegram_delivery_data:/app/data
    ports:
      - "127.0.0.1:${TELEGRAM_DELIVERY_API_PORT:-8080}:${TELEGRAM_DELIVERY_API_PORT:-8080}"
    healthcheck:
      test: ["CMD", "python", "-m", "maestro_bot.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  telegram_delivery_data:
