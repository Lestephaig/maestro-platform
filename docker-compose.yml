services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: maestro_db
      POSTGRES_USER: maestro_user
      POSTGRES_PASSWORD: maestro_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maestro_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - maestro_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - maestro_network

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://maestro_user:maestro_password@db:5432/maestro_db
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
      SITE_URL: https://www.maestrocast.ru/
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - private_media_volume:/app/private_media
      - ./logs:/app/logs
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - maestro_network
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application

  telegram-bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    networks:
      - maestro_network
    command: python manage.py run_telegram_bot
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import sys, time; p = Path('/tmp/maestro-telegram-bot.heartbeat'); sys.exit(0 if p.is_file() and time.time() - p.stat().st_mtime < 90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/shikalovichalexander/maestro-platform/nginx.conf:/etc/nginx/conf.d/default.conf
      - /home/shikalovichalexander/maestro-platform/ssl:/etc/nginx/ssl
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - maestro_network

volumes:
  postgres_data:
  static_volume:
  media_volume:
  private_media_volume:

networks:
  maestro_network:
    driver: bridge
