<div class="form-group{% if wide %} field-wide{% endif %}">
    <label for="{{ field.id_for_label }}" class="form-label">
        <i class="bi {{ icon }}"></i>{{ field.label }}
    </label>
    {{ field }}
    {% if field.errors %}
        <div class="invalid-feedback d-block">{{ field.errors.0 }}</div>
    {% endif %}
</div>
